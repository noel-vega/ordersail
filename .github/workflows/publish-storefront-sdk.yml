name: Publish storefront-sdk

# Manual trigger only — a broken public npm publish is hard to fully undo
# (unpublish is heavily restricted after ~72h), so this never runs on merge.
#
# This job only stages a version (npm stage publish) — it can't make
# anything public on its own, by design. A maintainer must separately
# review and `npm stage approve <stage-id>` (2FA required, CLI or
# npmjs.com's "Staged Packages" tab) before a version actually goes live.
# That's why the npm Trusted Publisher config for this package has "Allow
# npm publish" left unchecked — a compromised OIDC trust relationship or
# workflow still can't publish anything without that separate human step.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC) — id-token: write is what lets npm exchange
    # this job's GitHub identity for a short-lived publish token. No
    # NPM_TOKEN secret exists anywhere in this flow.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # honor packageManager (package.json) — node 22 ships npm 10, whose
      # `npm ci` can't reconcile this lockfile's `overrides`
      - run: npm install -g npm@11

      - run: npm ci

      - name: Build
        run: npm run build -w @ordersail/storefront-sdk

      - name: Typecheck
        run: npm run typecheck -w @ordersail/storefront-sdk

      - name: Stage
        run: npm stage publish --access public -w @ordersail/storefront-sdk
