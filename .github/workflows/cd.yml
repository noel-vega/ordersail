name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Required repo configuration before this workflow can run — see
# infra/terraform/README.md ("Production rollout"). In short:
#   vars.AWS_DEPLOY_ROLE_ARN = terraform output deploy_role_platform_arn
#   vars.AWS_REGION          = "us-east-1"
#   A GitHub Environment named "production" with a required reviewer, so
#   migrate / deploy-services / deploy-frontends pause for manual approval
#   before touching live resources — there's no staging to catch mistakes
#   first (that's M4 / OS-38).
#
# The migrate step lives in its own workflow (migrate.yml) so it can also be
# run on its own; this workflow calls it between build-and-push and deploy.

permissions:
  id-token: write
  contents: read

# One production-mutating run at a time. Migrate (when dispatched on its own) and
# Rollback share this same group, so a manual migration or rollback queues behind
# an in-flight deploy instead of racing it. cancel-in-progress is false on purpose
# — killing a run mid-migration or mid-update-service leaves production half-done.
# A batch of merges collapses to one running + one pending (the tip); the commits
# in between are cancelled while pending and the `guard` job skips the first run if
# a newer commit already landed.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Cheap pre-flight: on a push, bail if this commit is no longer the tip of main
  # (a later PR in the same merge batch already superseded it). Downstream jobs
  # chain off build-and-push via `needs:`, so skipping it cascades the whole
  # pipeline to "skipped" and the run still concludes green.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"   # manual dispatch always proceeds
            exit 0
          fi
          git fetch --quiet origin main
          TIP=$(git rev-parse FETCH_HEAD)
          if [ "$TIP" = "$GITHUB_SHA" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA superseded by $TIP — skipping deploy"
          fi

  build-and-push:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: merchant-api
            dockerfile: docker/merchant-api.Dockerfile
            ssm_key: merchant-api-uri
          - app: storefront-api
            dockerfile: docker/storefront-api.Dockerfile
            ssm_key: storefront-api-uri
          - app: worker
            dockerfile: docker/worker.Dockerfile
            ssm_key: worker-uri
          - app: pos-api
            dockerfile: docker/pos-api.Dockerfile
            ssm_key: pos-api-uri
          - app: migrator
            dockerfile: docker/migrate.Dockerfile
            ssm_key: migrator-uri
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Resolve ECR repo URI
        id: ecr-uri
        run: |
          URI=$(aws ssm get-parameter --name "/ordersail/production/ecr/${{ matrix.ssm_key }}" --query 'Parameter.Value' --output text)
          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      # ECR is IMMUTABLE — a re-pushed tag fails. On a workflow_dispatch re-run
      # of a commit already built, skip rather than error.
      - name: Skip build if this SHA is already in ECR
        id: check
        run: |
          if aws ecr describe-images --repository-name "ordersail-${{ matrix.app }}" \
               --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ordersail-${{ matrix.app }}:${{ github.sha }} already pushed — skipping build"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists != 'true'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists != 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.ecr-uri.outputs.uri }}:${{ github.sha }}
          # GHA layer cache, per-image scope. This runs on main (the default
          # branch), so it restores from the previous CD run — one cold build
          # right after each merge, warm thereafter. A durable ECR-backed
          # cache (type=registry) is deferred: the ECR repos are IMMUTABLE so
          # a moving :buildcache tag needs its own MUTABLE repo (OS-372 note).
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  migrate:
    needs: build-and-push
    uses: ./.github/workflows/migrate.yml
    with:
      image_tag: ${{ github.sha }}

  deploy-services:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        app: [merchant-api, storefront-api, worker, pos-api]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Register new task definition revision and update service
        run: |
          set -euo pipefail

          CLUSTER=$(aws ssm get-parameter --name /ordersail/production/ecs/cluster-name --query 'Parameter.Value' --output text)
          SERVICE=$(aws ssm get-parameter --name /ordersail/production/ecs/${{ matrix.app }}-service --query 'Parameter.Value' --output text)
          IMAGE_URI=$(aws ssm get-parameter --name /ordersail/production/ecr/${{ matrix.app }}-uri --query 'Parameter.Value' --output text)

          # The task definition (env vars + secrets + roles) is rendered by
          # Terraform (envs/production) and published to SSM — the single source
          # of truth. Read it, swap in the freshly-built image tag, register.
          # Env/secret changes committed to main.tf reach production here, with
          # no manual register-task-definition (OS-361).
          NEW=$(aws ssm get-parameter --name /ordersail/production/ecs/${{ matrix.app }}-taskdef --query 'Parameter.Value' --output text \
            | jq --arg IMAGE "$IMAGE_URI:${{ github.sha }}" '.containerDefinitions[0].image = $IMAGE')

          NEW_REVISION_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW" --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW_REVISION_ARN" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

  deploy-frontends:
    # after the APIs — a frontend built against an API with 0 running tasks,
    # or before its schema migration, is pointless (and it bakes the API URL
    # in at build time, so it can't self-heal later)
    needs: deploy-services
    runs-on: ubuntu-latest
    environment: production
    # storefront-web is not here: it's Ordersail's reference client for the
    # public storefront-api — a merchant forks it and hosts their own shop, so
    # it moves to its own public repo (see the "Extract storefront-web" Linear
    # project), not a first-party deploy target.
    strategy:
      matrix:
        include:
          - app: merchant-web
            ssm_prefix: merchant-web
            site_type: spa
          - app: website
            ssm_prefix: website
            site_type: astro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # honor packageManager (package.json) — node 22 ships npm 10, whose
      # `npm ci` can't reconcile this lockfile's `overrides`
      - run: npm install -g npm@11

      - run: npm ci

      - name: Build shared packages this frontend needs
        run: npm run build --workspace=merchant-sdk --if-present

      - name: Build ${{ matrix.app }}
        env:
          # merchant-web's CloudFront distribution routes /api/* to the
          # merchant-api ALB (module.frontend_merchant_web, enable_api_routing),
          # so the browser sees a same-origin relative path — no CORS, no mixed
          # content, no API subdomain.
          VITE_MERCHANT_API_BASE_URL: /api
          # VITE_STRIPE_PUBLISHABLE_KEY is a non-secret publishable identifier
          # (merchant-web's Stripe Connect view) — set as a repo variable, not a
          # secret.
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: npm run build --workspace=${{ matrix.app }}

      # SPA (merchant-web): one index.html, everything else is a hashed asset.
      - name: Sync to S3 and invalidate CloudFront (SPA)
        if: matrix.site_type == 'spa'
        run: |
          set -euo pipefail

          BUCKET=$(aws ssm get-parameter --name /ordersail/production/frontend/${{ matrix.ssm_prefix }}-bucket --query 'Parameter.Value' --output text)
          DIST_ID=$(aws ssm get-parameter --name /ordersail/production/frontend/${{ matrix.ssm_prefix }}-distribution --query 'Parameter.Value' --output text)
          DIST_DIR="apps/${{ matrix.app }}/dist"

          # hashed build assets get a 1-year immutable cache; index.html is
          # synced separately with no-cache since it's the one file whose
          # content actually changes per deploy under the same URL
          aws s3 sync "$DIST_DIR" "s3://$BUCKET" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude index.html
          aws s3 cp "$DIST_DIR/index.html" "s3://$BUCKET/index.html" \
            --cache-control "public,max-age=0,must-revalidate"

          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/index.html" "/"

      # Multi-page Astro (website): only _astro/* is fingerprinted; every page has
      # its own must-revalidate index.html. Ported from the former deploy-website.yml.
      - name: Sync to S3 and invalidate CloudFront (Astro multipage)
        if: matrix.site_type == 'astro'
        run: |
          set -euo pipefail

          BUCKET=$(aws ssm get-parameter --name /ordersail/production/frontend/${{ matrix.ssm_prefix }}-bucket --query 'Parameter.Value' --output text)
          DIST_ID=$(aws ssm get-parameter --name /ordersail/production/frontend/${{ matrix.ssm_prefix }}-distribution --query 'Parameter.Value' --output text)
          DIST_DIR="apps/${{ matrix.app }}/dist"

          # Pass 1 — fingerprinted build assets get a 1-year immutable cache.
          aws s3 sync "$DIST_DIR" "s3://$BUCKET" \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" --include "_astro/*"

          # Pass 2 — everything else (every page's index.html, 404.html,
          # favicons) has a stable URL but per-deploy content, so it must
          # revalidate. --delete prunes removed pages/assets. The just-uploaded
          # _astro/* files match on size/mtime and are skipped, keeping their
          # immutable header.
          aws s3 sync "$DIST_DIR" "s3://$BUCKET" --delete \
            --cache-control "public,max-age=0,must-revalidate"

          # Multi-page site — invalidate everything (a few cents/deploy) rather
          # than maintaining a per-path list.
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

  smoke-test:
    needs: [deploy-services, deploy-frontends]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Smoke-test live endpoints
        run: |
          set -uo pipefail   # NOT -e: run every check, accumulate failures

          # A green deploy only means ECS reached steady state and the CloudFront
          # invalidation was submitted — not that the apps serve correct
          # responses. Each API here gets its /health (a real DB[/Redis] query)
          # plus one guarded route that must answer 401 — proving routing + auth
          # middleware are loaded, i.e. the app isn't 500ing on everything. Each
          # frontend gets a marker string from its built HTML.
          # worker has no public endpoint (BullMQ consumer on a private subnet);
          # its liveness is covered by deploy-services' `wait services-stable`.

          fail=0
          hit() {        # hit <label> <want-status> [curl args...] <url>
            local label=$1 want=$2; shift 2
            local got n=0
            while :; do
              got=$(curl -s -o /tmp/smoke.body -w '%{http_code}' --max-time 15 "$@" || echo 000)
              [ "$got" = "$want" ] && break
              n=$((n + 1)); [ $n -ge 5 ] && break     # tolerate CloudFront propagation
              sleep 6
            done
            if [ "$got" = "$want" ]; then
              echo "ok    $label -> $got"
            else
              echo "FAIL  $label -> $got (want $want)"; head -c 300 /tmp/smoke.body; echo; fail=1
            fi
          }
          body_has() {   # body_has <label> <needle> [curl args...] <url>
            local label=$1 needle=$2; shift 2
            if curl -s --max-time 15 "$@" | grep -qF -- "$needle"; then
              echo "ok    $label body ~ '$needle'"
            else
              echo "FAIL  $label body missing '$needle'"; fail=1
            fi
          }
          frontend() {   # frontend <label> <body-marker> <url>
            # Normally expects 200 + the marker. While the pre-launch HTTP Basic
            # gate is up (OS-363) an unauthenticated GET is 401 with a Basic
            # challenge — that's the deliberate state, so accept it. Reverts to
            # the full check automatically once the gate is lifted.
            local label=$1 marker=$2 url=$3 code n=0
            while :; do
              code=$(curl -s -o /tmp/smoke.body -w '%{http_code}' --max-time 15 "$url" || echo 000)
              { [ "$code" = 200 ] || [ "$code" = 401 ]; } && break
              n=$((n + 1)); [ $n -ge 5 ] && break
              sleep 6
            done
            if [ "$code" = 401 ] && curl -sI --max-time 15 "$url" | grep -qi '^www-authenticate: *basic'; then
              echo "ok    $label -> 401 (pre-launch gate active, OS-363)"
            elif [ "$code" = 200 ] && grep -qF -- "$marker" /tmp/smoke.body; then
              echo "ok    $label -> 200, body ~ '$marker'"
            else
              echo "FAIL  $label -> $code (want 200 + '$marker', or 401 + Basic while gated)"
              head -c 300 /tmp/smoke.body; echo; fail=1
            fi
          }

          echo "== APIs =="
          hit      "merchant-api   GET /health"      200 https://merchant.ordersail.com/api/health
          body_has "merchant-api   GET /health"      '"status":"ok"' https://merchant.ordersail.com/api/health
          hit      "merchant-api   GET /products"    401 https://merchant.ordersail.com/api/products

          # api.ordersail.com is storefront-api's real public hostname (OS-560) —
          # the one published in the SDK docs, so check exactly what developers
          # call. Full TLS verification: no -k, unlike before the record existed.
          hit      "storefront-api GET /health"      200 https://api.ordersail.com/health
          body_has "storefront-api GET /health"      '"status":"ok"' https://api.ordersail.com/health
          hit      "storefront-api GET /products"    401 https://api.ordersail.com/products

          hit      "pos-api        GET /health"      200 https://pos.ordersail.com/health
          body_has "pos-api        GET /health"      '"status":"ok"' https://pos.ordersail.com/health
          hit      "pos-api        GET /pos/session" 401 https://pos.ordersail.com/pos/session

          echo "== Frontends =="
          frontend "merchant-web   GET /"            '<title>merchant-web</title>'  https://merchant.ordersail.com/
          frontend "website        GET /"            'Set sail with your store.'    https://ordersail.com/

          [ $fail -eq 0 ] && { echo "all smoke checks passed"; exit 0; }
          echo "::error::post-deploy smoke test failed"
          exit 1
