name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_all:
        # ECR tags are IMMUTABLE, so an image already tagged with this SHA is
        # never rebuilt. Dispatched on a commit CD already shipped (main's tip,
        # usually) this does nothing — it only reaches images that have no tag
        # for the SHA yet (e.g. its push run was superseded or failed first).
        description: >-
          Build every image not yet tagged with this SHA, instead of re-tagging
          the unchanged ones. An image CD already tagged is never rebuilt.
        type: boolean
        default: false

# Required repo configuration before this workflow can run — see
# infra/terraform/README.md ("Production rollout"). In short:
#   vars.AWS_DEPLOY_ROLE_ARN = terraform output deploy_role_platform_arn
#   vars.AWS_REGION          = "us-east-1"
#   A GitHub Environment named "production" with a required reviewer, so
#   migrate / deploy-services / deploy-frontends pause for manual approval
#   before touching live resources — there's no staging to catch mistakes
#   first (that's M4 / OS-38).
#
# The migrate step lives in its own workflow (migrate.yml) so it can also be
# run on its own; this workflow calls it between the image jobs and deploy.

permissions:
  id-token: write
  contents: read

# One production-mutating run at a time. Migrate (when dispatched on its own) and
# Rollback share this same group, so a manual migration or rollback queues behind
# an in-flight deploy instead of racing it. cancel-in-progress is false on purpose
# — killing a run mid-migration or mid-update-service leaves production half-done.
# A batch of merges collapses to one running + one pending (the tip); the commits
# in between are cancelled while pending and the `guard` job skips the first run if
# a newer commit already landed.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Cheap pre-flight: on a push, bail if this commit is no longer the tip of main
  # (a later PR in the same merge batch already superseded it). Downstream jobs
  # chain off guard via `needs:`, so skipping it cascades the whole
  # pipeline to "skipped" and the run still concludes green.
  #
  # Also reports whether the environment is parked (environment.yml `down`,
  # OS-379): every ECS service at desired-count 0. While parked the NAT may be
  # gone too (OS-380), so the migrator can't pull its image, and the APIs answer
  # 503 from an empty ALB target group. A parked run still builds + pushes the
  # images and deploys the frontends, but skips migrate, deploy-services and the
  # API smoke checks (OS-745). `up` resumes each service at its last-shipped
  # image, so re-run CD after `up` to ship the tip with its migrations.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      parked: ${{ steps.env.outputs.parked }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"   # manual dispatch always proceeds
            exit 0
          fi
          git fetch --quiet origin main
          TIP=$(git rev-parse FETCH_HEAD)
          if [ "$TIP" = "$GITHUB_SHA" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA superseded by $TIP — skipping deploy"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check.outputs.proceed == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: env
        if: steps.check.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          CLUSTER=$(aws ssm get-parameter --name /ordersail/production/ecs/cluster-name --query 'Parameter.Value' --output text)
          SERVICES=""
          for app in merchant-api storefront-api worker pos-api; do
            SERVICES="$SERVICES $(aws ssm get-parameter --name /ordersail/production/ecs/$app-service --query 'Parameter.Value' --output text)"
          done
          # shellcheck disable=SC2086  # word-split into one --services arg each
          OUT=$(aws ecs describe-services --cluster "$CLUSTER" --services $SERVICES --output json)
          # Fail closed: a name that doesn't resolve lands in failures[], not
          # services[], and would silently drop out of the sum — an empty sum is
          # 0, i.e. "parked", i.e. a skipped deploy. Demand all four, ACTIVE.
          ACTIVE=$(echo "$OUT" | jq '[.services[] | select(.status == "ACTIVE")] | length')
          FAILURES=$(echo "$OUT" | jq '.failures | length')
          if [ "$ACTIVE" != "4" ] || [ "$FAILURES" != "0" ]; then
            echo "::error::expected 4 ACTIVE ECS services, got $ACTIVE (failures: $(echo "$OUT" | jq -c .failures))"
            exit 1
          fi
          DESIRED=$(echo "$OUT" | jq '[.services[].desiredCount] | add')
          # Partly parked (some at 0, some not) counts as live on purpose: it's a
          # broken state, and the API smoke checks should go red on it.
          if [ "$DESIRED" = "0" ]; then
            echo "parked=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Environment is parked (every ECS service at desired-count 0) — building images and deploying frontends only; migrate, deploy-services and the API smoke checks are skipped. After Environment → up, re-run CD (workflow_dispatch) to ship $GITHUB_SHA."
          else
            echo "parked=false" >> "$GITHUB_OUTPUT"
          fi

  # Which images this commit builds and which it re-tags (OS-746). The base is
  # the newest earlier commit on main that every image repo has a tag for:
  # each CD run tags every image (built or re-tagged), and a commit guard
  # skipped as superseded has none, so it's normally the previous deployed
  # merge. Affected images are built; the rest get this SHA added as a tag on
  # the base's image — same digest, no build — so every downstream job
  # (migrate, deploy-services, rollback.yml) still addresses every image by
  # github.sha. Rules and image map: .github/actions/affected-images,
  # docker/images.json; each image's ECR repo is ordersail-<app>.
  plan-images:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.base.outputs.base }}
      build: ${{ steps.plan.outputs.build }}
      retag: ${{ steps.plan.outputs.retag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: base
        run: |
          set -euo pipefail
          # COMMON: tags present in every image repo. TAGGED: apps whose repo
          # already has this SHA (a workflow_dispatch of a commit CD shipped).
          COMMON=null
          TAGGED='[]'
          for app in $(jq -r '.[].app' docker/images.json); do
            TAGS=$(aws ecr list-images --repository-name "ordersail-$app" --filter tagStatus=TAGGED \
              --query 'imageIds[].imageTag' --output json)
            COMMON=$(jq -c --argjson t "$TAGS" 'if . == null then $t else map(select(. as $x | $t | any(. == $x))) end' <<<"$COMMON")
            if jq -e --arg s "$GITHUB_SHA" 'any(. == $s)' <<<"$TAGS" >/dev/null; then
              TAGGED=$(jq -c --arg a "$app" '. + [$a]' <<<"$TAGGED")
            fi
          done
          BASE=""
          for c in $(git rev-list --first-parent --max-count=50 "$GITHUB_SHA~1"); do
            if jq -e --arg c "$c" 'any(. == $c)' <<<"$COMMON" >/dev/null; then BASE=$c; break; fi
          done
          if [ -z "$BASE" ]; then
            echo "::notice::no earlier commit has every image in ECR — building every image"
          else
            echo "base: $BASE ($(git log --format=%s -1 "$BASE"))"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "tagged=$TAGGED" >> "$GITHUB_OUTPUT"

      - id: affected
        uses: ./.github/actions/affected-images
        with:
          base: ${{ steps.base.outputs.base || github.sha }}
          head: ${{ github.sha }}
          all: ${{ inputs.rebuild_all == true || steps.base.outputs.base == '' }}
          force-paths: .github/workflows/cd.yml

      # ECR is IMMUTABLE — a re-pushed tag fails — so an image already tagged
      # with this SHA is dropped from both lists, rebuild_all included.
      - id: plan
        env:
          TAGGED: ${{ steps.base.outputs.tagged }}
          AFFECTED: ${{ steps.affected.outputs.affected }}
          UNAFFECTED: ${{ steps.affected.outputs.unaffected }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # a jq program — $a/$tagged are jq vars
          UNTAGGED='map(select(.app as $a | $tagged | any(. == $a) | not))'
          if [ "$TAGGED" != "[]" ]; then
            echo "::notice::already tagged $GITHUB_SHA, skipping: $(jq -r 'join(", ")' <<<"$TAGGED")"
          fi
          echo "build=$(jq -c --argjson tagged "$TAGGED" "$UNTAGGED" <<<"$AFFECTED")" >> "$GITHUB_OUTPUT"
          echo "retag=$(jq -c --argjson tagged "$TAGGED" "$UNTAGGED" <<<"$UNAFFECTED")" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: build-and-push (${{ matrix.app }})
    needs: [guard, plan-images]
    if: needs.plan-images.outputs.build != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan-images.outputs.build) }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.target }}.Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/ordersail-${{ matrix.app }}:${{ github.sha }}
          # GHA layer cache, per-image scope. This runs on main (the default
          # branch), so it restores from the previous CD run — one cold build
          # right after each merge, warm thereafter. A durable ECR-backed
          # cache (type=registry) is deferred: the ECR repos are IMMUTABLE so
          # a moving :buildcache tag needs its own MUTABLE repo (OS-372 note).
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Unchanged images: tag the base commit's image with this SHA. ECR's IMMUTABLE
  # setting forbids moving an existing tag, not adding one to an image.
  retag:
    needs: [guard, plan-images]
    if: needs.plan-images.outputs.retag != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Tag the base images with ${{ github.sha }}
        env:
          BASE: ${{ needs.plan-images.outputs.base }}
          RETAG: ${{ needs.plan-images.outputs.retag }}
        run: |
          set -euo pipefail
          for app in $(jq -r '.[].app' <<<"$RETAG"); do
            scripts/ecr-add-tag.sh "ordersail-$app" imageTag="$BASE" "$GITHUB_SHA"
          done

  # Single gate for "every image exists at github.sha", whichever mix of
  # build-and-push and retag produced them (either may be skipped as empty).
  #
  # Also decides whether migrate must run (OS-747). migrate.yml tags each
  # migrator image it applies successfully with `migrated-<digest>`; a re-tagged
  # (unchanged) migrator shares its digest, so it inherits the marker. Missing
  # marker — a new migrator build, or one whose migrate was skipped (parked) or
  # failed — means run it. Re-apply by hand: `gh workflow run Migrate -f image_tag=<sha>`.
  images-ready:
    needs: [guard, plan-images, build-and-push, retag]
    if: >-
      !cancelled() && needs.plan-images.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.build-and-push.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.retag.result)
    runs-on: ubuntu-latest
    outputs:
      migrate: ${{ steps.migrate.outputs.needed }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: migrate
        run: |
          set -euo pipefail
          IMG=$(aws ecr describe-images --repository-name ordersail-migrator \
            --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0]' --output json)
          MARK="migrated-$(jq -r '.imageDigest | ltrimstr("sha256:")' <<<"$IMG")"
          if jq -e --arg m "$MARK" '.imageTags | any(. == $m)' <<<"$IMG" >/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::migrator image $(jq -r .imageDigest <<<"$IMG") already applied ($MARK) — skipping migrate"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "migrator image $(jq -r .imageDigest <<<"$IMG") not yet applied — migrate will run"
          fi

  # Fails before the production approval gate and before anything is mutated:
  # a task-definition contract can be well-formed yet undeployable, and
  # terraform plan can't see it. Ungated (no `environment:`) so it runs
  # immediately alongside the image jobs — deploy_role_platform trusts both the
  # branch-ref and environment-scoped OIDC sub claims (see its Terraform).
  verify-contracts:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify task-definition contracts are deployable
        run: node scripts/verify-taskdef-contracts.mjs

  migrate:
    needs: [guard, images-ready, verify-contracts]
    # skipped while parked (see guard), and when this migrator image has
    # already been applied (see images-ready).
    # Explicit `!cancelled()` + results, never the implicit success(): that
    # one checks the whole upstream graph, so a legitimately skipped
    # build-and-push or retag (nothing to build / nothing to re-tag) skipped
    # migrate — and with it every deploy — while the run still went green.
    if: >-
      !cancelled() && needs.guard.outputs.parked != 'true' &&
      needs.images-ready.result == 'success' && needs.verify-contracts.result == 'success' &&
      needs.images-ready.outputs.migrate == 'true'
    uses: ./.github/workflows/migrate.yml
    with:
      image_tag: ${{ github.sha }}

  deploy-services:
    # after a successful migrate, or when migrate was skipped as already
    # applied — never while parked, after a failed migrate, or on a failed
    # contract check (which migrate used to stand in for). Explicit
    # `!cancelled()` for the same reason as migrate's.
    needs: [guard, images-ready, verify-contracts, migrate]
    if: >-
      !cancelled() && needs.guard.outputs.parked != 'true' &&
      needs.images-ready.result == 'success' && needs.verify-contracts.result == 'success' &&
      (needs.migrate.result == 'success' ||
       (needs.migrate.result == 'skipped' && needs.images-ready.outputs.migrate == 'false'))
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        app: [merchant-api, storefront-api, worker, pos-api]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Register new task definition revision and update service
        run: |
          set -euo pipefail

          CLUSTER=$(aws ssm get-parameter --name /ordersail/production/ecs/cluster-name --query 'Parameter.Value' --output text)
          SERVICE=$(aws ssm get-parameter --name /ordersail/production/ecs/${{ matrix.app }}-service --query 'Parameter.Value' --output text)
          IMAGE_URI=$(aws ssm get-parameter --name /ordersail/production/ecr/${{ matrix.app }}-uri --query 'Parameter.Value' --output text)

          # The task definition (env vars + secrets + roles) is rendered by
          # Terraform (envs/production) and published to SSM — the single source
          # of truth. Read it, swap in the freshly-built image tag, register.
          # Env/secret changes committed to main.tf reach production here, with
          # no manual register-task-definition (OS-361).
          NEW=$(aws ssm get-parameter --name /ordersail/production/ecs/${{ matrix.app }}-taskdef --query 'Parameter.Value' --output text \
            | jq --arg IMAGE "$IMAGE_URI:${{ github.sha }}" '.containerDefinitions[0].image = $IMAGE')

          NEW_REVISION_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW" --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW_REVISION_ARN" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

  # Build now, publish later (OS-748): the frontends build alongside the image
  # jobs, so the end of the pipeline is only the S3 sync + invalidation in
  # deploy-frontends. Ungated (no `environment:`) — it touches nothing live, and
  # VITE_STRIPE_PUBLISHABLE_KEY is a repo variable, not a production-environment
  # one. storefront-web is not here: it's Ordersail's reference client for the
  # public storefront-api — a merchant forks it and hosts their own shop, so it
  # lives in its own public repo, not a first-party deploy target.
  build-frontends:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [merchant-web, website]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace
        with:
          # main-scoped node_modules cache every PR restores (OS-749). One leg
          # saves: both legs share the key, so a second save only races and
          # fails to reserve it.
          save: ${{ matrix.app == 'merchant-web' }}

      - name: Build shared packages this frontend needs
        run: npm run build --workspace=merchant-sdk --if-present

      - name: Build ${{ matrix.app }}
        env:
          # merchant-web's CloudFront distribution routes /api/* to the
          # merchant-api ALB (module.frontend_merchant_web, enable_api_routing),
          # so the browser sees a same-origin relative path — no CORS, no mixed
          # content, no API subdomain.
          VITE_MERCHANT_API_BASE_URL: /api
          # VITE_STRIPE_PUBLISHABLE_KEY is a non-secret publishable identifier
          # (merchant-web's Stripe Connect view) — set as a repo variable, not a
          # secret.
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: npm run build --workspace=${{ matrix.app }}

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist
          # a dotfile in public/ (e.g. .well-known/) must ship too — v4 drops
          # hidden files by default
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy-frontends:
    # published after the APIs — a frontend live against an API with 0 running
    # tasks, or before its schema migration, is pointless (and it bakes the API
    # URL in at build time, so it can't self-heal later).
    # While parked deploy-services is skipped, and the frontends ship anyway:
    # the public website doesn't depend on the APIs, and merchant-web is down
    # with them regardless; the post-`up` CD re-run redeploys it against them.
    # Only publishes: build-frontends already built the dist/ it downloads.
    needs: [guard, images-ready, verify-contracts, build-frontends, deploy-services]
    if: >-
      !cancelled() && needs.images-ready.result == 'success' &&
      needs.verify-contracts.result == 'success' && needs.build-frontends.result == 'success' &&
      (needs.deploy-services.result == 'success' ||
       (needs.guard.outputs.parked == 'true' && needs.deploy-services.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        include:
          - app: merchant-web
            ssm_prefix: merchant-web
            site_type: spa
          - app: website
            ssm_prefix: website
            site_type: astro
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # SPA (merchant-web): one index.html, everything else is a hashed asset.
      - name: Sync to S3 and invalidate CloudFront (SPA)
        if: matrix.site_type == 'spa'
        run: |
          set -euo pipefail

          BUCKET=$(aws ssm get-parameter --name /ordersail/production/frontend/${{ matrix.ssm_prefix }}-bucket --query 'Parameter.Value' --output text)
          DIST_ID=$(aws ssm get-parameter --name /ordersail/production/frontend/${{ matrix.ssm_prefix }}-distribution --query 'Parameter.Value' --output text)
          DIST_DIR="apps/${{ matrix.app }}/dist"

          # hashed build assets get a 1-year immutable cache; index.html is
          # synced separately with no-cache since it's the one file whose
          # content actually changes per deploy under the same URL
          aws s3 sync "$DIST_DIR" "s3://$BUCKET" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude index.html
          aws s3 cp "$DIST_DIR/index.html" "s3://$BUCKET/index.html" \
            --cache-control "public,max-age=0,must-revalidate"

          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/index.html" "/"

      # Multi-page Astro (website): only _astro/* is fingerprinted; every page has
      # its own must-revalidate index.html. Ported from the former deploy-website.yml.
      - name: Sync to S3 and invalidate CloudFront (Astro multipage)
        if: matrix.site_type == 'astro'
        run: |
          set -euo pipefail

          BUCKET=$(aws ssm get-parameter --name /ordersail/production/frontend/${{ matrix.ssm_prefix }}-bucket --query 'Parameter.Value' --output text)
          DIST_ID=$(aws ssm get-parameter --name /ordersail/production/frontend/${{ matrix.ssm_prefix }}-distribution --query 'Parameter.Value' --output text)
          DIST_DIR="apps/${{ matrix.app }}/dist"

          # Pass 1 — fingerprinted build assets get a 1-year immutable cache.
          aws s3 sync "$DIST_DIR" "s3://$BUCKET" \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" --include "_astro/*"

          # Pass 2 — everything else (every page's index.html, 404.html,
          # favicons) has a stable URL but per-deploy content, so it must
          # revalidate. --delete prunes removed pages/assets. The just-uploaded
          # _astro/* files match on size/mtime and are skipped, keeping their
          # immutable header.
          aws s3 sync "$DIST_DIR" "s3://$BUCKET" --delete \
            --cache-control "public,max-age=0,must-revalidate"

          # Multi-page site — invalidate everything (a few cents/deploy) rather
          # than maintaining a per-path list.
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

  smoke-test:
    needs: [guard, deploy-frontends]
    # deploy-frontends only succeeds after a real deploy or a parked run's
    # frontends-only one (its gate) — the API checks then skip, see the script
    if: ${{ !cancelled() && needs.deploy-frontends.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      PARKED: ${{ needs.guard.outputs.parked }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Smoke-test live endpoints
        run: |
          set -uo pipefail   # NOT -e: run every check, accumulate failures

          # A green deploy only means ECS reached steady state and the CloudFront
          # invalidation was submitted — not that the apps serve correct
          # responses. Each API here gets its /health (a real DB[/Redis] query)
          # plus one guarded route that must answer 401 — proving routing + auth
          # middleware are loaded, i.e. the app isn't 500ing on everything. Each
          # frontend gets a marker string from its built HTML.
          # worker has no public endpoint (BullMQ consumer on a private subnet);
          # its liveness is covered by deploy-services' `wait services-stable`.

          fail=0
          hit() {        # hit <label> <want-status> [curl args...] <url>
            local label=$1 want=$2; shift 2
            local got n=0
            while :; do
              got=$(curl -s -o /tmp/smoke.body -w '%{http_code}' --max-time 15 "$@" || echo 000)
              [ "$got" = "$want" ] && break
              n=$((n + 1)); [ $n -ge 5 ] && break     # tolerate CloudFront propagation
              sleep 6
            done
            if [ "$got" = "$want" ]; then
              echo "ok    $label -> $got"
            else
              echo "FAIL  $label -> $got (want $want)"; head -c 300 /tmp/smoke.body; echo; fail=1
            fi
          }
          body_has() {   # body_has <label> <needle> [curl args...] <url>
            local label=$1 needle=$2; shift 2
            if curl -s --max-time 15 "$@" | grep -qF -- "$needle"; then
              echo "ok    $label body ~ '$needle'"
            else
              echo "FAIL  $label body missing '$needle'"; fail=1
            fi
          }
          frontend() {   # frontend <label> <public|gated> <body-marker> <url>
            # public: must be 200 + the marker — a 401 means the site got gated
            # again by mistake, so it fails.
            # gated: behind the pre-launch HTTP Basic gate (OS-363), so an
            # unauthenticated GET is 401 with a Basic challenge — the deliberate
            # state, so accept it. 200 + the marker also passes, so lifting the
            # gate at launch doesn't break the smoke test.
            local label=$1 mode=$2 marker=$3 url=$4 code n=0
            while :; do
              code=$(curl -s -o /tmp/smoke.body -w '%{http_code}' --max-time 15 "$url" || echo 000)
              [ "$code" = 200 ] && break
              [ "$mode" = gated ] && [ "$code" = 401 ] && break
              n=$((n + 1)); [ $n -ge 5 ] && break
              sleep 6
            done
            if [ "$mode" = gated ] && [ "$code" = 401 ] && curl -sI --max-time 15 "$url" | grep -qi '^www-authenticate: *basic'; then
              echo "ok    $label -> 401 (pre-launch gate active, OS-363)"
            elif [ "$code" = 200 ] && grep -qF -- "$marker" /tmp/smoke.body; then
              echo "ok    $label -> 200, body ~ '$marker'"
            elif [ "$mode" = gated ]; then
              echo "FAIL  $label -> $code (want 200 + '$marker', or 401 + Basic while gated)"
              head -c 300 /tmp/smoke.body; echo; fail=1
            else
              echo "FAIL  $label -> $code (want 200 + '$marker'; public site)"
              head -c 300 /tmp/smoke.body; echo; fail=1
            fi
          }

          if [ "$PARKED" != "true" ]; then
            echo "== APIs =="
            hit      "merchant-api   GET /health"      200 https://merchant.ordersail.com/api/health
            body_has "merchant-api   GET /health"      '"status":"ok"' https://merchant.ordersail.com/api/health
            hit      "merchant-api   GET /products"    401 https://merchant.ordersail.com/api/products

            # storefront.ordersail.com is storefront-api's real public hostname (OS-560) —
            # the one published in the SDK docs, so check exactly what developers
            # call. Full TLS verification: no -k, unlike before the record existed.
            hit      "storefront-api GET /health"      200 https://storefront.ordersail.com/health
            body_has "storefront-api GET /health"      '"status":"ok"' https://storefront.ordersail.com/health
            hit      "storefront-api GET /v1/products" 401 https://storefront.ordersail.com/v1/products

            hit      "pos-api        GET /health"      200 https://pos.ordersail.com/health
            body_has "pos-api        GET /health"      '"status":"ok"' https://pos.ordersail.com/health
            hit      "pos-api        GET /pos/session" 401 https://pos.ordersail.com/pos/session
          else
            # environment.yml `down` (OS-379): every service at desired 0, so the
            # ALB answers 503 — nothing to check until `up` (OS-745)
            echo "== APIs == skipped: environment parked"
          fi

          echo "== Frontends =="
          frontend "merchant-web   GET /"            gated  '<title>merchant-web</title>'  https://merchant.ordersail.com/
          frontend "website        GET /"            public 'Set sail with your store.'    https://ordersail.com/
          # Both directory-index rewrite branches (OS-365): trailing slash and bare path.
          frontend "website        GET /features/"   public 'Everything a small store runs on' https://ordersail.com/features/
          frontend "website        GET /features"    public 'Everything a small store runs on' https://ordersail.com/features

          [ $fail -eq 0 ] && { echo "all smoke checks passed"; exit 0; }
          echo "::error::post-deploy smoke test failed"
          exit 1
