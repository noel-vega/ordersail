name: Migrate

# The DB migration gate: runs `drizzle-kit migrate` (packages/db) against the
# production RDS via a one-off Fargate task (see infra/terraform/.../migrator.tf).
#
# Runnable on its own (`gh workflow run Migrate`) so migrations don't have to
# ride a full deploy, and called by cd.yml between its image jobs (once every
# image is tagged with the SHA) and deploy-services. Either way the
# `production` Environment gate applies.
#
# A successful run tags the migrator image `migrated-<digest>`; cd.yml skips
# this workflow while the migrator image carries that marker (OS-747). To
# re-apply anyway (e.g. after restoring the database from a snapshot), run it
# standalone: `gh workflow run Migrate -f image_tag=<sha>`.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: migrator image tag (git SHA). Default = the most recently pushed image.
        type: string
        required: false
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true

permissions:
  id-token: write
  contents: read

# Inside a reusable workflow `github.workflow` is the CALLER's name, so this is
# "CD" when cd.yml calls us and "Migrate" on a standalone `gh workflow run`.
#   - standalone  -> join the shared "production-deploy" lock, so a manual
#     migration queues behind an in-flight deploy / rollback instead of racing it.
#   - called by CD -> a per-run group that never blocks: cd.yml already holds
#     "production-deploy" for the whole pipeline, and a called workflow that reuses
#     its caller's concurrency group deadlocks.
concurrency:
  group: ${{ github.workflow == 'Migrate' && 'production-deploy' || format('migrate-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run migration task
        id: run
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          # workflow_call (cd.yml) always passes the SHA; a bare `gh workflow run
          # Migrate` leaves it empty — fall back to the newest image in the repo
          # (there's no :latest tag anymore). cd.yml re-tags an unchanged image
          # with each new SHA (OS-746), so the newest image can carry several
          # tags — any of them resolves to the same digest.
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG=$(aws ecr describe-images --repository-name ordersail-migrator \
              --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' --output text)
            echo "resolved most-recent migrator tag: $IMAGE_TAG"
          fi

          CLUSTER=$(aws ssm get-parameter --name /ordersail/production/ecs/cluster-name --query 'Parameter.Value' --output text)
          SUBNETS=$(aws ssm get-parameter --name /ordersail/production/network/private-subnet-ids --query 'Parameter.Value' --output text)
          SG=$(aws ssm get-parameter --name /ordersail/production/network/ecs-tasks-security-group --query 'Parameter.Value' --output text)
          MIGRATOR_URI=$(aws ssm get-parameter --name /ordersail/production/ecr/migrator-uri --query 'Parameter.Value' --output text)

          # `run-task --overrides` cannot change the container image — only
          # command/env/cpu/memory. Register a revision from the Terraform-rendered
          # SSM contract (same source of truth as cd.yml's deploy-services, OS-361)
          # pinned to this image tag and run that.
          NEW=$(aws ssm get-parameter --name /ordersail/production/ecs/migrator-taskdef --query 'Parameter.Value' --output text \
            | jq --arg IMG "$MIGRATOR_URI:$IMAGE_TAG" '.containerDefinitions[0].image = $IMG')
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW" --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task-def: $TASK_DEF_ARN"

          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          # dump the container's stdout/stderr — the CD run is otherwise a black box on failure
          TASK_ID=${TASK_ARN##*/}
          echo "--- /ecs/ordersail-migrator : migrator/migrator/$TASK_ID ---"
          aws logs get-log-events --log-group-name /ecs/ordersail-migrator \
            --log-stream-name "migrator/migrator/$TASK_ID" --start-from-head \
            --query 'events[].message' --output text || true
          echo "--- end log ---"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          STOPPED_REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::migration task exited with code $EXIT_CODE — $STOPPED_REASON"
            exit 1
          fi
          echo "migration task exited 0"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Mark this exact migrator image as applied, so cd.yml skips migrate while
      # the migrator is unchanged — a re-tagged image shares the digest and so
      # the marker (OS-747). Only after exit 0: a failed or skipped run leaves
      # no marker, and the next CD retries.
      - name: Mark the migrator image as applied
        env:
          IMAGE_TAG: ${{ steps.run.outputs.image_tag }}
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images --repository-name ordersail-migrator \
            --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          scripts/ecr-add-tag.sh ordersail-migrator imageDigest="$DIGEST" "migrated-${DIGEST#sha256:}"
