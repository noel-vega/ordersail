name: CI

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run every project, not just those affected by the diff"
        type: boolean
        default: false
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Nx runs only the projects affected by the diff and restores unchanged
    # task outputs from the Nx Cloud remote cache. Replaces the old
    # build-lint-test + typecheck jobs, which each rebuilt every shared
    # package from scratch, every run.
    runs-on: ubuntu-latest
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    services:
      # storefront-api/merchant-api/worker all connect to a real Redis for
      # BullMQ (see packages/queue's bullmqConnectionOptions) — without this,
      # any test that enqueues a job only ever exercises the
      # timeout-then-catch fallback path, never the real one. GitHub-hosted
      # runners publish service container ports to localhost, matching
      # packages/queue's default host/port.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # nx-set-shas walks history to find the PR merge-base
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # honor packageManager (package.json) — node 22 ships npm 10, whose
      # `npm ci` can't reconcile this lockfile's `overrides`
      - run: npm install -g npm@11

      - run: npm ci

      # sets NX_BASE / NX_HEAD — on pull_request, NX_BASE is the merge-base
      # with the target branch
      - uses: nrwl/nx-set-shas@v4

      # Proves the deploy-time contract guard still catches the defects it was
      # written for (OS-652 / OS-654 / OS-560). Pure fixtures — no AWS, no
      # network — so it belongs on every PR, not just in CD.
      - name: Verify the task-def contract guard still catches its regressions
        run: node scripts/verify-taskdef-contracts.mjs --self-test

      - name: Verify (build, lint, typecheck, test)
        # `test` boots a throwaway Postgres via Testcontainers (jest
        # globalSetup in packages/test-support) — ubuntu-latest has Docker.
        # pos-api still mocks the DB. pos (Expo toolchain) has its own job.
        run: |
          if [ "${{ inputs.run_all }}" = "true" ]; then
            npx nx run-many -t build lint:ci typecheck test --exclude=pos
          else
            npx nx affected -t build lint:ci typecheck test --exclude=pos
          fi

  pos:
    # apps/pos (Expo): its own toolchain — eslint-config-expo (flat), no
    # nest build / jest. pos-sdk must be built first — pos imports it in
    # several files and its eslint import resolver + tsc need the dist/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run build --workspace=pos-sdk

      - name: Lint
        run: npm run lint --workspace=pos

      - name: Typecheck
        run: npm run typecheck --workspace=pos

      - name: expo-doctor
        env:
          EXPO_NO_TELEMETRY: "1"
          # skip only the "packages match versions required by installed Expo
          # SDK" sub-check — it queries api.expo.dev for the latest SDK-57
          # patch ranges, so CI goes red the moment Expo cuts a patch release
          # regardless of this repo's contents. `npm run doctor` locally still
          # runs it. The other 20 checks stay hard gates.
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
        run: npm run doctor --workspace=pos

  # Which Docker images this diff can change, so docker-smoke-build only builds
  # those (OS-744) — a docs/website/merchant-web PR builds none. The selection
  # rules and the image map are shared with cd.yml (.github/actions/affected-images,
  # docker/images.json); a change to this workflow builds every image, so a
  # PR touching docker-smoke-build exercises it.
  affected-images:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.affected.outputs.affected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4

      - id: affected
        uses: ./.github/actions/affected-images
        with:
          base: ${{ env.NX_BASE }}
          head: ${{ env.NX_HEAD }}
          all: ${{ inputs.run_all == true }}
          force-paths: .github/workflows/ci.yml

  docker-smoke-build:
    # explicit name: with an `include` matrix the default would append every
    # matrix value — keep the check runs named "docker-smoke-build (<target>)"
    name: docker-smoke-build (${{ matrix.target }})
    needs: affected-images
    if: needs.affected-images.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      # one image failing shouldn't cancel the others mid-build
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.affected-images.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.target }}.Dockerfile
          push: false
          # Read-only: restore main's layer cache (a PR can read its base
          # branch's GHA cache), never write. A PR-ref cache entry is only
          # restorable by that same PR, and each PR's mode=max export was
          # ~5 GB — enough to push the repo past GitHub's 10 GB cap and
          # LRU-evict main's layers, leaving CD to build cold (OS-743). Only
          # cd.yml's build-and-push, running on main, writes these scopes
          # (one per image, named by its app).
          cache-from: type=gha,scope=${{ matrix.app }}

  # The one required check for the image builds. Branch protection can't
  # require the per-target checks: a skipped matrix never expands, so a PR
  # that builds none (or only some) of them would wait on the rest forever.
  # Always runs, and passes only when every selected image built, or none
  # were selected.
  docker-smoke-build-result:
    needs: [affected-images, docker-smoke-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SELECT_RESULT: ${{ needs.affected-images.result }}
          IMAGES: ${{ needs.affected-images.outputs.images }}
          BUILD_RESULT: ${{ needs.docker-smoke-build.result }}
        run: |
          set -euo pipefail
          echo "affected-images: $SELECT_RESULT ($IMAGES)"
          echo "docker-smoke-build: $BUILD_RESULT"
          if [ "$SELECT_RESULT" != "success" ]; then
            echo "::error::image selection did not succeed"
            exit 1
          fi
          if [ "$IMAGES" = "[]" ] && [ "$BUILD_RESULT" = "skipped" ]; then
            exit 0
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::docker-smoke-build $BUILD_RESULT"
            exit 1
          fi
