# Local Fluent Bit: ships logs to the local Loki (never to Grafana Cloud).
# Two sources — see docs/observability.md → "Logs in local Grafana".
#
# `npm run dev` logs go through the local Alloy (docker/alloy/config.alloy),
# which takes the Loki push API on :3100 and forwards each entry unchanged —
# only `Host` differs from a direct-to-Loki output (OS-738). The production
# rehearsal still goes straight to Loki, as production does, until OS-741
# moves production behind Alloy; then they move together.
#
#   1. `npm run dev`: each service writes its JSON lines to .logs/<service>.log
#      (packages/logging); the tail inputs below pick them up.
#   2. `npm run log-shipping:up`: the production rehearsal. The merchant-api
#      image's stdout arrives through Docker's `fluentd` log driver — the one ECS
#      FireLens uses under the hood. Its [OUTPUT] keys are the same ones
#      merchant-api's task definition passes as `logConfiguration.options`
#      (infra/terraform/modules/ecs-service); production only swaps the
#      destination (Tls on, Port 443, Http_User, Http_Passwd). Change the
#      line-shaping keys (Remove_Keys, Line_Format, Drop_Single_Key) in both
#      places together.
#
# Either way the record reaching an output has the line under `log`, and
# Line_Format key_value + Drop_Single_Key send that value alone: Loki stores
# the raw pino JSON, not a wrapper around it.

[SERVICE]
    Flush     1
    Log_Level info

# --- 1. npm run dev ----------------------------------------------------------

[INPUT]
    Name             tail
    Tag              dev.merchant-api
    Path             /var/log/ordersail/merchant-api.log
    DB               /fluent-bit/state/tail.db
    Read_from_Head   true
    Refresh_Interval 2

[INPUT]
    Name             tail
    Tag              dev.storefront-api
    Path             /var/log/ordersail/storefront-api.log
    DB               /fluent-bit/state/tail.db
    Read_from_Head   true
    Refresh_Interval 2

[INPUT]
    Name             tail
    Tag              dev.pos-api
    Path             /var/log/ordersail/pos-api.log
    DB               /fluent-bit/state/tail.db
    Read_from_Head   true
    Refresh_Interval 2

[INPUT]
    Name             tail
    Tag              dev.worker
    Path             /var/log/ordersail/worker.log
    DB               /fluent-bit/state/tail.db
    Read_from_Head   true
    Refresh_Interval 2

[OUTPUT]
    Name            loki
    Match           dev.merchant-api
    Host            alloy
    Port            3100
    Labels          service_name=merchant-api,deployment_environment=development
    Line_Format     key_value
    Drop_Single_Key on

[OUTPUT]
    Name            loki
    Match           dev.storefront-api
    Host            alloy
    Port            3100
    Labels          service_name=storefront-api,deployment_environment=development
    Line_Format     key_value
    Drop_Single_Key on

[OUTPUT]
    Name            loki
    Match           dev.pos-api
    Host            alloy
    Port            3100
    Labels          service_name=pos-api,deployment_environment=development
    Line_Format     key_value
    Drop_Single_Key on

[OUTPUT]
    Name            loki
    Match           dev.worker
    Host            alloy
    Port            3100
    Labels          service_name=worker,deployment_environment=development
    Line_Format     key_value
    Drop_Single_Key on

# --- 2. production rehearsal --------------------------------------------------

# Direct to Loki on purpose: this mirrors merchant-api's live FireLens options,
# which still push to Grafana Cloud Loki directly (OS-741 changes both).

# each stdout line arrives as { log, container_id, container_name, source }
[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

[OUTPUT]
    Name            loki
    Match           merchant-api-firelens*
    Host            loki
    Port            3100
    Tls             off
    Labels          service_name=merchant-api,deployment_environment=production-rehearsal
    Remove_Keys     container_id,container_name,source
    Line_Format     key_value
    Drop_Single_Key on
