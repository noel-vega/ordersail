# Local development infrastructure — one command for the whole stack:
#
#   npm run up      # start everything, wait until healthy
#   npm run down    # stop (keeps data)
#   npm run reset   # stop and delete volumes (Postgres data + MinIO objects)
#   npm run logs    # tail the infra containers
#
# Loki + Grafana + Fluent Bit make the logs of `npm run dev` searchable at
# http://localhost:3300 (docs/observability.md → "Logs in local Grafana"). Its
# traces and metrics go to Alloy, which routes them to Tempo and Prometheus
# ("Traces in local Grafana", "Metrics in local Grafana").
# Nothing here talks to Grafana Cloud.
#
# Opt-in `log-shipping` profile (not started by `npm run up`):
#
#   npm run log-shipping:up     # adds merchant-api's production image, logging the way ECS does
#   npm run log-shipping:down
#
# The `ordersail-product-images` bucket is created automatically the first time
# merchant-api (or `npm run seed -w seed`) starts — see
# packages/storage/src/index.ts `ensureBucket()`. No init sidecar needed.
#
# Overrides (ports, credentials) come from a repo-root `.env` — copy
# `.env.example`. This file is compose-only; the apps read their own
# `apps/*/.env`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ordersail-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ordersail}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ordersail-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ordersail}']
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: ordersail-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    container_name: ordersail-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - ordersail-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:latest
    container_name: ordersail-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8025/readyz']
      interval: 2s
      timeout: 5s
      retries: 15

  # --- local logs: Fluent Bit → Loki → Grafana ---------------------------------

  # no volume: logs last until `npm run down`
  loki:
    image: grafana/loki:3.5.5
    container_name: ordersail-loki
    restart: unless-stopped
    ports:
      - '${LOKI_PORT:-3100}:3100'

  # --- local traces + metrics: services → Alloy (OTLP/HTTP) → Tempo / Prometheus

  # The one OTLP endpoint `npm run dev` services export to (ALLOY_OTLP_PORT in
  # .env). Routes traces to Tempo and metrics to Prometheus
  # (docker/alloy/config.alloy). No volume: nothing in this pipeline needs
  # --storage.path to survive a restart.
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: ordersail-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - '${ALLOY_OTLP_PORT:-4318}:4318'
      # Alloy's UI: the pipeline graph and each component's health
      - '${ALLOY_UI_PORT:-12345}:12345'
    healthcheck:
      # the image has neither curl nor wget; bash's /dev/tcp reads /-/ready
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/12345 && printf "GET /-/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  # no volume: traces last until `npm run down`. Reached only through Alloy
  # (and Grafana) inside the compose network, so nothing is published.
  tempo:
    image: grafana/tempo:2.8.2
    container_name: ordersail-tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:3200/ready']
      interval: 5s
      timeout: 3s
      retries: 20
      # Tempo reports not-ready for its first ~15s while the ring settles
      start_period: 30s

  # no volume: metrics last until `npm run down`. Fed by Alloy over OTLP
  # (docker/prometheus/prometheus.yml); published only for its own UI.
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: ordersail-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9090/-/ready']
      interval: 2s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:12.1.1
    container_name: ordersail-grafana
    restart: unless-stopped
    environment:
      # local only: no login, straight into Explore
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports:
      - '${GRAFANA_PORT:-3300}:3000'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - tempo
      - prometheus

  # same image + tag as the production `log-router` sidecar
  # (infra/terraform/modules/ecs-service) — bump them together
  fluent-bit:
    image: public.ecr.aws/aws-observability/aws-for-fluent-bit:2.34.3.20260923
    container_name: ordersail-fluent-bit
    restart: unless-stopped
    ports:
      # the Docker daemon (not a container) connects here for the fluentd log
      # driver below, so it has to be published on the host
      - '127.0.0.1:${FLUENT_BIT_PORT:-24224}:24224'
    volumes:
      - ./docker/fluent-bit/dev.conf:/fluent-bit/etc/fluent-bit.conf:ro
      # where `npm run dev` services write their JSON lines (packages/logging)
      - ./.logs:/var/log/ordersail:ro
      # tail offsets, so a Fluent Bit restart doesn't re-send whole files
      - ordersail-fluent-bit-state:/fluent-bit/state
    depends_on:
      - loki

  # merchant-api as it runs in production: the real image, NODE_ENV=production
  # (so pino writes JSON), stdout handed to Fluent Bit by the same log driver
  # FireLens uses. Separate from `npm run dev`'s merchant-api on :3000.
  merchant-api-log-shipping:
    build:
      context: .
      dockerfile: docker/merchant-api.Dockerfile
    container_name: ordersail-merchant-api-log-shipping
    profiles: [log-shipping]
    env_file:
      - path: apps/merchant-api/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '3000'
      # the app's .env points at localhost; inside the compose network the
      # infra is reached by service name
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ordersail}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - '${MERCHANT_API_LOG_SHIPPING_PORT:-3020}:3000'
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:${FLUENT_BIT_PORT:-24224}
        fluentd-async: 'true'
        tag: merchant-api-firelens
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      fluent-bit:
        condition: service_started

volumes:
  ordersail-db-data:
    name: ordersail-db-data
  ordersail-minio-data:
    name: ordersail-minio-data
  ordersail-fluent-bit-state:
    name: ordersail-fluent-bit-state
